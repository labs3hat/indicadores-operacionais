<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="5; url=https://indicadores3hat.lovable.app/executivo">
  <title>Painel desativado</title>
  <style>
    :root { --bg: #f6f5f2; --fg: #1f2328; --muted: #5b616b; --accent: #b4235a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16171a; --fg: #ececec; --muted: #a3a8b0; --accent: #f06292; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { max-width: 480px; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0 0 1.25rem; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Este painel foi desativado</h1>
    <p>Os indicadores de venda agora ficam no Painel Executivo do Grupo 3HAT.
       Você será levado para lá em alguns segundos.</p>
    <a href="https://indicadores3hat.lovable.app/executivo">Abrir o Painel Executivo</a>
  </main>
</body>
</html>
